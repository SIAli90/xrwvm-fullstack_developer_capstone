name: Full Stack Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Django dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run Django system checks
        working-directory: server
        run: python manage.py check

      - name: Run Django migrations
        working-directory: server
        run: python manage.py migrate --noinput

      - name: Check Node dealer service syntax
        run: node --check server/database/app.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install React dependencies
        working-directory: server/frontend
        run: npm ci

      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build
