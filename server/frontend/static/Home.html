<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars Dealership</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    const logout = async (event) => {
      if (event) event.preventDefault();
      await fetch('/djangoapp/logout');
      sessionStorage.removeItem('username');
      sessionStorage.removeItem('firstname');
      sessionStorage.removeItem('lastname');
      window.location.href = '/';
    };

    const checkSession = () => {
      const currentUser = sessionStorage.getItem('username');
      const panel = document.getElementById('loginlogout');
      if (currentUser) {
        panel.innerHTML = `<span class="nav-link">${currentUser}</span><a class="nav-link" href="#" onclick="logout(event)">Logout</a>`;
      } else {
        panel.innerHTML = '<a class="nav-link" href="/login">Login</a><a class="nav-link" href="/register">Register</a>';
      }
    };
  </script>
</head>
<body onload="checkSession()">
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; min-height:1in;">
    <div class="container-fluid">
      <h2 style="padding-right:5%;">Cars Dealership</h2>
      <div class="navbar-nav me-auto">
        <a class="nav-link active" aria-current="page" href="/">Home</a>
        <a class="nav-link" href="/dealers">Dealers</a>
        <a class="nav-link" href="/about">About Us</a>
        <a class="nav-link" href="/contact">Contact Us</a>
      </div>
      <div class="navbar-nav" id="loginlogout"></div>
    </div>
  </nav>

  <main style="display:flex; flex-direction:column; align-items:center; padding:50px 20px;">
    <div class="card" style="max-width:800px;">
      <img src="/static/car_dealership.jpg" class="card-img-top" alt="Cars Dealership showroom">
      <div class="card-body text-center">
        <h1 class="h3">Welcome to Cars Dealership</h1>
        <p>Find dealerships, compare locations, read customer reviews, and share your own experience.</p>
        <a href="/dealers" class="btn btn-info">View Dealerships</a>
      </div>
    </div>
  </main>
</body>
</html>
